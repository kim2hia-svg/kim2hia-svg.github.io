<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="개인 생산성 대시보드" />
    <title>Personal Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#home">Dashboard</a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        메뉴
      </button>
      <nav id="site-nav" class="site-nav" aria-label="주요 메뉴">
        <a href="#home">Home</a>
        <a href="#todo">Todo</a>
        <a href="#calendar">Calendar</a>
        <a href="#games">Games</a>
      </nav>
    </header>

    <main>
      <section id="home" class="panel hero" aria-labelledby="home-title">
        <p class="eyebrow">PERSONAL SPACE</p>
        <h1 id="home-title">오늘을 정리하는<br />나만의 대시보드</h1>
        <p>할 일과 일정을 한곳에서 확인하고, 잠시 쉬어갈 게임도 준비해 두었습니다.</p>
      </section>

      <section id="todo" class="panel" aria-labelledby="todo-title">
        <p class="eyebrow">TASKS</p>
        <h2 id="todo-title">Todo</h2>
        <p>할 일을 관리하는 공간입니다.</p>
      </section>

      <section id="calendar" class="panel" aria-labelledby="calendar-title">
        <p class="eyebrow">SCHEDULE</p>
        <h2 id="calendar-title">Calendar</h2>
        <p>일정을 날짜별로 확인하는 공간입니다.</p>
      </section>

      <section id="games" class="panel games-placeholder" aria-labelledby="games-title">
        <p class="eyebrow">PLAYGROUND</p>
        <h2 id="games-title">Games</h2>
        <p>게임 영역을 준비 중입니다.</p>
      </section>
    </main>
  </body>
</html>
